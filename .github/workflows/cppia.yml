name: CPPIA

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: CPPIA, macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          runtime: cppia
      # Fails if the runner has no Metal device, rather than passing on the
      # line the check prints without one, or if the shaders fell back to MSL
      # because the build had no Metal compiler.
      - run: |
          hxn check cppia 2>&1 | tee check.txt
          grep -q '^compute: 64 values' check.txt
          ! grep -q 'no Metal compiler' check.txt
